# Push a tag like v1.0.0 → builds, runs the release checks and attaches the zip to a draft GitHub Release.
# Needs the repository variable LIMENN_WEB_MODEL_URL (where gliner-web-q8.onnx can be downloaded); its hash is
# checked against models/models.lock.json, so a wrong or tampered file fails the build.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require the second-detector model URL
        run: |
          test -n "$LIMENN_WEB_MODEL_URL" || { echo "::error::Repository variable LIMENN_WEB_MODEL_URL is not set: the release would ship without gliner-web-q8.onnx"; exit 1; }
        env:
          LIMENN_WEB_MODEL_URL: ${{ vars.LIMENN_WEB_MODEL_URL }}
      - run: npm ci
      - run: npm test
      - run: npm run release
        env:
          LIMENN_WEB_MODEL_URL: ${{ vars.LIMENN_WEB_MODEL_URL }}
      - name: Check tag matches manifest version
        run: test "v$(node -p "require('./public/manifest.json').version")" = "$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" release/*.zip --draft --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
